name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

jobs:
  build-apk:
    name: Build QuickSQL Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        working-directory: react-native-quicksql
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Generate Android Native Project if needed
        working-directory: react-native-quicksql
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx --yes expo prebuild --platform android --no-install
          fi
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: react-native-quicksql/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Exists
        working-directory: react-native-quicksql/android
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickSQL-Android-APK
          path: react-native-quicksql/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
