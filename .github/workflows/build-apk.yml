name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build QuickSQL Full Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-native-quicksql/package.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Auto-accept licenses using pre-installed sdkmanager
          if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        working-directory: react-native-quicksql
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Generate Android Native Project (Expo Prebuild)
        working-directory: react-native-quicksql
        run: |
          npx --yes expo prebuild --platform android --clean --no-install
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          # Ensure standalone offline bundle embedding in both debug and release
          sed -i 's/bundleCommand = "export:embed"/bundleCommand = "export:embed"\n    bundleInDebug = true/' android/app/build.gradle
          chmod +x android/gradlew

      - name: Build Full Standalone Android APK (Release & Debug)
        working-directory: react-native-quicksql/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Generated Standalone APK
        working-directory: react-native-quicksql/android
        run: |
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/*-release.apk ../dist-apk/QuickSQL-Standalone.apk
          ls -lh ../dist-apk/

      - name: Upload Full Standalone APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickSQL-Full-Standalone-APK
          path: react-native-quicksql/dist-apk/QuickSQL-Standalone.apk
          retention-days: 30
