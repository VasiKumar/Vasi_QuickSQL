name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build QuickSQL Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-native-quicksql/package.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Auto-accept licenses using pre-installed sdkmanager
          if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        working-directory: react-native-quicksql
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Generate Android Native Project
        working-directory: react-native-quicksql
        run: |
          npx --yes expo prebuild --platform android --clean --no-install
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: react-native-quicksql/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK
        working-directory: react-native-quicksql/android
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickSQL-Android-APK
          path: react-native-quicksql/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
